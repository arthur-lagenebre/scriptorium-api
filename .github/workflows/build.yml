name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Scriptorium.Mtg.slnx

      - name: Build
        run: dotnet build Scriptorium.Mtg.slnx --no-restore --configuration Release

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Verify no pending model changes
        run: dotnet ef migrations has-pending-model-changes --project src/Scriptorium.Mtg.Api --no-build --configuration Release
